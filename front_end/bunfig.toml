[install]
# Only install package versions published at least 6 hours ago
minimumReleaseAge = 21600 # seconds

# Exclude trusted packages from the age gate
minimumReleaseAgeExcludes = []

[install.security]
scanner = "@socketsecurity/bun-security-scanner"

[test]
# Two files because imports are hoisted: Testing Library binds `screen` to
# document.body on import, so jsdom must be registered by an earlier preload.
# Isolation can't be set here; the `test` script passes --parallel instead.
preload = ["./test.dom.ts", "./test.setup.ts"]
