name: Global Health Monitor edition
description: Ask Claude to draft the next monthly Global Health Monitor edition as a pull request.
title: "@claude Global Health Monitor edition: <Month YYYY>"
labels: ["global-health-monitor"]
body:
  - type: textarea
    id: instructions
    attributes:
      label: Instructions for Claude
      description: Keep this text so the draft follows the edition checklist.
      value: |
        @claude Please draft the next Global Health Monitor edition by following `.claude/skills/ghm-edition/SKILL.md`, using the publication date and notes below. Open a pull request and link it here.
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Publication date
      description: YYYY-MM-DD. Leave empty to use the day the draft runs.
  - type: textarea
    id: notes
    attributes:
      label: Focus and notes
      description: Anything to emphasise, questions to add or drop, sources to use, or diseases to skip this month.
