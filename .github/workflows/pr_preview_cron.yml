# =============================================================================
# PR Preview Maintenance
# =============================================================================
#
# Runs daily to cleanup stale previews (closed, archived, or labeled "Stale").
# Archiving a PR closes it without firing any workflow event, so this is the
# only cleanup an archived PR gets.
#
# Runs weekly (and on manual dispatch) to redeploy active previews with a
# fresh database reset.
#
# =============================================================================

name: PR Preview Maintenance

on:
  schedule:
    - cron: "0 7 * * 0" # Sunday 07:00 UTC: cleanup + redeploy
    - cron: "0 7 * * 1-6" # Monday-Saturday 07:00 UTC: cleanup only
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

env:
  FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  list-previews:
    name: List Preview Apps
    runs-on: ubuntu-latest
    outputs:
      previews: ${{ steps.matrix.outputs.previews }}
    steps:
      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: 0.4.14

      - name: List preview apps and PR info
        id: matrix
        run: |
          echo "Listing Fly apps for org: ${FLY_ORG}"
          APPS_JSON=$(flyctl apps list --json --org "${FLY_ORG}")
          echo "Raw app count: $(echo "$APPS_JSON" | jq length)"

          PREVIEW_APPS=$(echo "$APPS_JSON" | jq -r '.[].Name | select(startswith("metaculus-pr-"))')

          if [ -z "$PREVIEW_APPS" ]; then
            echo "previews=[]" >> $GITHUB_OUTPUT
            echo "No preview apps found"
            exit 0
          fi

          OUT='[]'
          while IFS= read -r APP_NAME; do
            [ -z "$APP_NAME" ] && continue
            PREVIEW_ID="${APP_NAME#metaculus-}"
            PR_NUM=$(echo "$PREVIEW_ID" | sed -n 's/^pr-\([0-9]*\)-.*/\1/p')
            [ -z "$PR_NUM" ] && continue

            IS_STALE="false"
            if PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUM}" 2>/tmp/pr_err); then
              HEAD_REF=$(echo "$PR_JSON" | jq -r '.head.ref')
              PR_STATE=$(echo "$PR_JSON" | jq -r '.state')
              HAS_STALE_LABEL=$(echo "$PR_JSON" | jq -r 'any(.labels[]; .name == "Stale")')
              if [ "$PR_STATE" != "open" ] || [ "$HAS_STALE_LABEL" = "true" ]; then
                IS_STALE="true"
              fi
            elif grep -q "HTTP 404" /tmp/pr_err; then
              # Archived PRs are closed and 404 for GITHUB_TOKEN.
              echo "PR #${PR_NUM} not found (archived?) - marking ${APP_NAME} stale"
              HEAD_REF=""
              IS_STALE="true"
            else
              # Transient API errors must not destroy an active preview.
              echo "⚠️ Could not read PR #${PR_NUM}, skipping ${APP_NAME}: $(cat /tmp/pr_err)"
              continue
            fi

            ENTRY=$(jq -n \
              --arg app "$APP_NAME" \
              --arg pr "$PR_NUM" \
              --arg preview_id "$PREVIEW_ID" \
              --arg head_ref "$HEAD_REF" \
              --argjson is_stale "$IS_STALE" \
              '{app: $app, pr_number: $pr, preview_id: $preview_id, head_ref: $head_ref, is_stale: $is_stale}')
            OUT=$(echo "$OUT" | jq --argjson e "$ENTRY" '. + [$e]')
          done <<< "$PREVIEW_APPS"

          echo "previews<<EOF" >> $GITHUB_OUTPUT
          echo "$OUT" | jq -c '.' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Found $(echo "$OUT" | jq length) preview(s)"

  cleanup-stale:
    name: Cleanup Stale Previews
    needs: list-previews
    if: needs.list-previews.outputs.previews != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.list-previews.outputs.previews) }}
    steps:
      - name: Trigger cleanup for stale PR
        if: matrix.is_stale == true
        run: |
          gh workflow run pr_preview.yml \
            --repo "${{ github.repository }}" \
            -f pr_number=${{ matrix.pr_number }} \
            -f action=cleanup \
            -f cleanup_reason=Stale
          echo "Triggered cleanup for PR #${{ matrix.pr_number }} (${{ matrix.app }})"

  redeploy-active:
    name: Redeploy Active Previews
    needs: list-previews
    if: needs.list-previews.outputs.previews != '[]' && github.event.schedule != '0 7 * * 1-6'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.list-previews.outputs.previews) }}
    steps:
      - name: Trigger redeploy for active PR
        if: matrix.is_stale == false
        # Runs main's pr_preview.yml, so every preview gets the current deploy
        # settings. pr_preview.yml still builds the PR's own head commit.
        # update_comment=false keeps the redeploy from touching the PR, so the
        # stale job only sees real activity.
        run: |
          gh workflow run pr_preview.yml \
            --repo "${{ github.repository }}" \
            -f pr_number=${{ matrix.pr_number }} \
            -f action=deploy \
            -f reset_db=true \
            -f update_comment=false
          echo "Triggered redeploy with DB reset for PR #${{ matrix.pr_number }} (${{ matrix.app }})"
